[tox]
envlist = py310, ruff, mypy
isolated_build = True

[testenv]
description = Run Pytest unit tests
deps =
    pytest
    pytest-cov
    pytest-mock
commands =
    pytest {posargs:tests} --cov=src --cov-report=term-missing

[testenv:ruff]
description = Run Ruff for linting and formatting check
deps = ruff
commands =
    ruff check src tests main.py
    ruff format --check src tests main.py

[testenv:mypy]
description = Run Mypy for static type checking
deps =
    mypy
    pandas-stubs
    pydantic
commands = mypy src main.py
