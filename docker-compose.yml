# MLflow Tracking Server 開發環境
# 使用方式: docker compose up -d
#
# MLflow UI: http://localhost:5000
# 資料持久化: Docker volume (mlflow-data)

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mlflow-data:
    driver: local
