<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #F8FAFC;">

    <defs>
        <!-- Shadows -->
        <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
        </filter>
        <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
        </filter>

        <!-- Markers -->
        <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
        </marker>
        <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706" />
        </marker>
        <marker id="arrow-empty" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="none" stroke="#64748B" stroke-width="1.5" />
        </marker>
    </defs>

    <!-- Header -->
    <rect x="0" y="0" width="1600" height="90" fill="#FFFFFF" border-bottom="1px solid #E2E8F0"/>
    <text x="800" y="45" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">High Level Design – 企業級 ML 服務平台系統架構圖 (C4 Container 級別)</text>
    <text x="800" y="70" font-size="16" fill="#475569" text-anchor="middle">六角架構 (Hexagonal) • 四大平面隔離 (Four Planes) • 事件驅動 (Event-Driven) | SDD HLD v1.0</text>
    <line x1="0" y1="90" x2="1600" y2="90" stroke="#E2E8F0" stroke-width="2"/>


    <!-- ========================================== -->
    <!-- CROSS-CUTTING CAPABILITIES (Right Sidebar) -->
    <!-- ========================================== -->
    <rect x="1350" y="110" width="230" height="1060" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow-sm)"/>
    <text x="1465" y="140" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Cross-Cutting (橫切關注點)</text>
    <line x1="1370" y1="155" x2="1560" y2="155" stroke="#CBD5E1" stroke-width="1"/>

    <g transform="translate(1370, 180)">
        <rect width="190" height="60" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="95" y="25" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Observability Plane</text>
        <text x="95" y="45" font-size="11" fill="#64748B" text-anchor="middle">OpenTelemetry / Logs / Metrics</text>
    </g>
    <g transform="translate(1370, 260)">
        <rect width="190" height="60" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="95" y="25" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Security &amp; IAM</text>
        <text x="95" y="45" font-size="11" fill="#64748B" text-anchor="middle">OIDC Auth / RBAC / Secrets</text>
    </g>
    <g transform="translate(1370, 340)">
        <rect width="190" height="60" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="95" y="25" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Audit &amp; Governance</text>
        <text x="95" y="45" font-size="11" fill="#64748B" text-anchor="middle">Central Audit Log</text>
    </g>

    <!-- Legend inside right sidebar -->
    <g transform="translate(1370, 800)">
        <rect width="190" height="150" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="95" y="25" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">圖例 (Legend)</text>

        <path d="M 20 50 L 50 50" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <text x="65" y="54" font-size="12" fill="#475569">同步呼叫 (Sync)</text>

        <path d="M 20 80 L 50 80" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-async)"/>
        <text x="65" y="84" font-size="12" fill="#475569">非同步事件 (Async/Event)</text>

        <path d="M 20 110 L 50 110" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-empty)"/>
        <text x="65" y="114" font-size="12" fill="#475569">實作介面 (Implements)</text>
    </g>


    <!-- ========================================== -->
    <!-- 1. CLIENT LAYER -->
    <!-- ========================================== -->
    <g transform="translate(20, 110)">
        <rect width="1300" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
        <text x="20" y="30" font-size="16" font-weight="bold" fill="#0F172A">1. Client / Entry Point (外部與觸發端)</text>
        <text x="20" y="50" font-size="12" fill="#64748B">系統的唯一外部進入點，透過 HTTP/REST 或事件觸發</text>

        <rect x="350" y="15" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="440" y="40" font-size="14" font-weight="bold" fill="#0369A1" text-anchor="middle">React SPA (Web UI)</text>

        <rect x="580" y="15" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="670" y="40" font-size="14" font-weight="bold" fill="#0369A1" text-anchor="middle">Third-party Systems</text>

        <rect x="810" y="15" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="900" y="40" font-size="14" font-weight="bold" fill="#0369A1" text-anchor="middle">CI/CD / Schedulers</text>
    </g>

    <!-- Connectors 1 to 2 -->
    <path d="M 460 200 L 460 235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
    <path d="M 690 200 L 690 235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
    <path d="M 920 200 L 920 235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>


    <!-- ========================================== -->
    <!-- 2. CONTROL PLANE (Hexagonal ML Core) -->
    <!-- ========================================== -->
    <g transform="translate(20, 220)">
        <rect width="1300" height="360" rx="8" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="2"/>
        <text x="20" y="30" font-size="16" font-weight="bold" fill="#0369A1">2. Control Plane (控制平面 / 六角架構核心)</text>
        <text x="20" y="50" font-size="12" fill="#0284C7">禁止包含基礎設施依賴。只負責：身分驗證、派發 Command、執行領域業務邏輯、持久化狀態</text>

        <!-- AC-01 Badge -->
        <rect x="1120" y="15" width="160" height="25" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
        <text x="1200" y="32" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">AC-01 API Isolation</text>

        <!-- Driving Adapters (API Edge) -->
        <rect x="350" y="70" width="600" height="50" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow-sm)"/>
        <text x="650" y="100" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">FastAPI Gateway / SSE State Projection (Driving Adapters)</text>

        <!-- Application & Domain (The Hexagon Core) -->
        <rect x="150" y="150" width="1000" height="130" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="650" y="175" font-size="14" font-weight="bold" fill="#065F46" text-anchor="middle">Bounded Contexts (Application Services &amp; Domain Core)</text>

        <g transform="translate(170, 190)">
            <rect width="180" height="70" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
            <text x="90" y="25" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Data Context</text>
            <text x="90" y="45" font-size="11" fill="#047857" text-anchor="middle">Dataset &amp; Quality Rules</text>
        </g>
        <g transform="translate(365, 190)">
            <rect width="180" height="70" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
            <text x="90" y="25" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Pipeline Context</text>
            <text x="90" y="45" font-size="11" fill="#047857" text-anchor="middle">DAG Definition</text>
        </g>
        <g transform="translate(560, 190)">
            <rect width="180" height="70" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
            <text x="90" y="25" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Training Context</text>
            <text x="90" y="45" font-size="11" fill="#047857" text-anchor="middle">Job / Run State Machine</text>
        </g>
        <g transform="translate(755, 190)">
            <rect width="180" height="70" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
            <text x="90" y="25" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Model Context</text>
            <text x="90" y="45" font-size="11" fill="#047857" text-anchor="middle">Immutable Lifecycle</text>
        </g>
        <g transform="translate(950, 190)">
            <rect width="180" height="70" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
            <text x="90" y="25" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Serving Context</text>
            <text x="90" y="45" font-size="11" fill="#047857" text-anchor="middle">Deployment Management</text>
        </g>

        <!-- Connectors API to Domain -->
        <path d="M 650 120 L 650 145" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <text x="660" y="138" font-size="11" fill="#475569">Commands</text>

        <!-- Outbound Ports -->
        <rect x="250" y="310" width="800" height="40" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="650" y="335" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Domain Ports (Interfaces): IRepository, IJobExecutor, IEventPublisher, IModelRegistry</text>

        <path d="M 650 280 L 650 305" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
    </g>


    <!-- ========================================== -->
    <!-- 3. EVENT BACKBONE & ORCHESTRATION PLANE    -->
    <!-- ========================================== -->
    <g transform="translate(20, 600)">
        <rect width="1300" height="150" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
        <text x="20" y="30" font-size="16" font-weight="bold" fill="#B45309">3. Orchestration Plane &amp; Event Backbone (協作平面與事件驅動)</text>
        <text x="20" y="50" font-size="12" fill="#D97706">跨領域非同步解耦，平台不重造工作流引擎 (AC-05)</text>

        <!-- AC-04 Badge -->
        <rect x="1120" y="15" width="160" height="25" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
        <text x="1200" y="32" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">AC-04 Tx Outbox</text>

        <!-- Kafka -->
        <rect x="150" y="70" width="500" height="60" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="400" y="95" font-size="15" font-weight="bold" fill="#B45309" text-anchor="middle">Kafka Event Backbone (Message Broker)</text>
        <text x="400" y="115" font-size="12" fill="#D97706" text-anchor="middle">Publish Domain Events (e.g., ml.training.job.created.v1)</text>

        <!-- Airflow -->
        <rect x="750" y="70" width="400" height="60" rx="4" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="950" y="95" font-size="15" font-weight="bold" fill="#6D28D9" text-anchor="middle">Argo Workflows / Apache Airflow</text>
        <text x="950" y="115" font-size="12" fill="#7C3AED" text-anchor="middle">(External DAG &amp; Task Scheduler)</text>

        <!-- Connector Outbox to Kafka -->
        <path d="M 400 -30 L 400 60" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-async)"/>
        <text x="410" y="15" font-size="12" font-weight="bold" fill="#D97706">Transactional Outbox Publish</text>

        <!-- Connector Kafka to Orchestrator -->
        <path d="M 650 100 L 740 100" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-async)"/>
        <text x="700" y="90" font-size="11" fill="#D97706" text-anchor="middle">Consume</text>
    </g>


    <!-- ========================================== -->
    <!-- 4. EXECUTION & SERVING PLANES (Bottom Split)-->
    <!-- ========================================== -->
    <!-- Execution Plane -->
    <g transform="translate(20, 770)">
        <rect width="800" height="180" rx="8" fill="#FEF2F2" stroke="#FDA4AF" stroke-width="2"/>
        <text x="20" y="30" font-size="16" font-weight="bold" fill="#BE185D">4a. Execution Plane (執行平面)</text>
        <text x="20" y="50" font-size="12" fill="#E11D48">實體隔離高運算任務，強制資源配額 (AC-06)</text>

        <!-- AC-03 Badge -->
        <rect x="620" y="15" width="160" height="25" rx="12" fill="#FFE4E6" stroke="#E11D48" stroke-width="1"/>
        <text x="700" y="32" font-size="11" font-weight="bold" fill="#BE185D" text-anchor="middle">AC-03 Local Guardrail</text>

        <!-- Local Worker -->
        <rect x="50" y="80" width="220" height="70" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="160" y="105" font-size="14" font-weight="bold" fill="#9F1239" text-anchor="middle">Local Python Worker</text>
        <text x="160" y="125" font-size="11" font-weight="bold" fill="#E11D48" text-anchor="middle">[強制記憶體全表掃描防線]</text>
        <text x="160" y="140" font-size="10" fill="#475569" text-anchor="middle">Data Quality Check</text>

        <!-- K8s -->
        <rect x="290" y="80" width="220" height="70" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="400" y="115" font-size="14" font-weight="bold" fill="#9F1239" text-anchor="middle">Kubernetes / GPU</text>
        <text x="400" y="135" font-size="11" fill="#475569" text-anchor="middle">Distributed Training</text>

        <!-- Spark -->
        <rect x="530" y="80" width="220" height="70" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="640" y="115" font-size="14" font-weight="bold" fill="#9F1239" text-anchor="middle">Spark Cluster</text>
        <text x="640" y="135" font-size="11" fill="#475569" text-anchor="middle">Heavy Data ETL</text>

        <!-- Connector Airflow to Workers -->
        <path d="M 400 -20 L 400 30" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <path d="M 400 30 L 160 30 L 160 70" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <path d="M 400 30 L 400 70" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <path d="M 400 30 L 640 30 L 640 70" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <text x="410" y="10" font-size="12" font-weight="bold" fill="#334155">Dispatch Tasks</text>
    </g>

    <!-- Serving Plane -->
    <g transform="translate(840, 770)">
        <rect width="480" height="180" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
        <text x="20" y="30" font-size="16" font-weight="bold" fill="#16A34A">4b. Serving Plane (服務與推論)</text>
        <text x="20" y="50" font-size="12" fill="#15803D">Canonical Prediction 契約對接下游製程</text>

        <rect x="40" y="80" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" filter="url(#shadow-md)"/>
        <text x="130" y="110" font-size="14" font-weight="bold" fill="#14532D" text-anchor="middle">Inference Runtime</text>
        <text x="130" y="130" font-size="11" fill="#15803D" text-anchor="middle">Triton / FastAPI</text>

        <rect x="260" y="80" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#D53F8C" stroke-width="2" stroke-dasharray="4,2" filter="url(#shadow-md)"/>
        <text x="350" y="110" font-size="14" font-weight="bold" fill="#97266D" text-anchor="middle">SPACE / SPC System</text>
        <text x="350" y="130" font-size="11" fill="#D53F8C" text-anchor="middle">Downstream Visualization</text>

        <!-- Canonical Prediction Flow -->
        <path d="M 220 115 L 250 115" stroke="#334155" stroke-width="2" marker-end="url(#arrow-sync)"/>
        <text x="235" y="105" font-size="10" font-weight="bold" fill="#16A34A" text-anchor="middle">Egress</text>
    </g>


    <!-- ========================================== -->
    <!-- 5. INFRASTRUCTURE & STORAGE (Driven Adapters)-->
    <!-- ========================================== -->
    <g transform="translate(20, 970)">
        <rect width="1300" height="130" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
        <text x="20" y="30" font-size="16" font-weight="bold" fill="#334155">5. Infrastructure &amp; Storage (Driven Adapters / 基礎設施層)</text>
        <text x="20" y="50" font-size="12" fill="#475569">被動接受控制平面與執行平面的調用，保存實體資料</text>

        <rect x="150" y="65" width="250" height="50" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="275" y="95" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">PostgreSQL / Redis</text>
        <text x="275" y="110" font-size="10" fill="#64748B" text-anchor="middle">State DB, Outbox &amp; Read Model</text>

        <rect x="525" y="65" width="250" height="50" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="650" y="95" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Object Storage (S3 / MinIO)</text>
        <text x="650" y="110" font-size="10" fill="#64748B" text-anchor="middle">Datasets &amp; Model Artifacts</text>

        <rect x="900" y="65" width="250" height="50" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="1025" y="95" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">MLflow</text>
        <text x="1025" y="110" font-size="10" font-weight="bold" fill="#64748B" text-anchor="middle">Immutable Model Registry (AC-04)</text>

        <!-- Connections from planes to storage (dotted implements lines conceptually) -->
        <path d="M 275 -410 V 55" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-empty)"/>
        <path d="M 650 -20 V 55" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-empty)"/>
        <path d="M 1025 -410 V 55" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-empty)"/>
    </g>

</svg>
